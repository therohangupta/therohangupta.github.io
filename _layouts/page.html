---
layout: default
---
<div class="post-layout">
<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>

<aside class="post-toc" aria-label="Table of contents" hidden>
  <p class="post-toc-title">On this page</p>
  <nav class="post-toc-nav">
    <ol class="post-toc-list"></ol>
  </nav>
</aside>
</div>

<script src="{{ '/assets/js/article-enhancements.js' | relative_url }}" defer></script>
